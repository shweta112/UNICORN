# logging options
save_dir: /UNICORN_ext_validation/unicorn_val
project: unicorn_val
name: her
visualize: False
register: 0
modality_embedding: 0
model: unicorn
input_dims: [768,768,768,768]
#feature sizes
input_dim:
  resnet: 1024
  retccl: 2048
  ctranspath: 768

# task definition
task: multiclass
target: pCR
num_classes: 2
cohort: HER
ext_cohorts: []
clini_info: [] 
seed: 42

# model options
subnetwork_name: transformer
norm: raw
feats: ctranspath
num_tiles: -1
pad_tiles: false
criterion : CrossEntropyLoss

# training options
folds: 5
num_epochs: 20
optimizer: AdamW
scheduler: null
lr: 2.0e-05
wd: 2.0e-05
bs: 1
accumulate_grad_batches: 16
stop_criterion: loss
resume: null
debug: false
stain_dropout: 0.0
clini_info_dropout: 0.0
num_workers: 8

# cohort data
preview_dir: "" #where preview images are saved, only needed for visualization
cohort_data:
  HER:
    targets: ['0', '1']
    clini_table: her.csv
    slide_csv: ['he.csv','ihc.csv']
    cohort_features: ['ctranspath_all_8','ctranspath_all_8']
    feature_dir: 
      ctranspath_all_8: ../HER2+_deid/h5_files/256px_ctranspath_0mpp_8.0xdown_normal
  TNBC:
    targets: ['0', '1']
    clini_table: tnbc.csv
    slide_csv: ['he.csv','ihc.csv']
    cohort_features: ['ctranspath_all_8','ctranspath_all_8']
    feature_dir: 
      ctranspath_all_8: ../TNBC_deid/h5_files/256px_ctranspath_0mpp_8.0xdown_normal

subnetwork:
  transformer:
    dim: 512
    depth: 2
    heads: 4
    mlp_dim: 512
    pool: 'cls'
    dim_head: 64
    dropout: 0.2
    emb_dropout: 0.
  perceiver:
      num_freq_bands: 6
      depth: 2
      max_freq: 10.0
      num_latents: 256
      latent_dim: 512
      cross_heads: 1
      latent_heads: 8
      cross_dim_head: 64
      latent_dim_head: 64
      attn_dropout: 0.1
      ff_dropout: 0
      weight_tie_layers: false
      fourier_encode_data: true
      self_per_cross_attn: 1
